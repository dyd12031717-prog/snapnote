<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'NSC'; src:url('fonts/NotoSansSC-var.ttf'); font-weight:100 900; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1000px; height:486px; overflow:hidden; }
  body { font-family:'NSC','WenQuanYi Zen Hei',sans-serif; -webkit-font-smoothing:antialiased; background:#ffffff; }
  .canvas { position:relative; width:1000px; height:486px; background:#ffffff; padding:0; }
  .node { position:absolute; width:300px; height:248px; border-radius:12px;
    border:1.5px solid #9FC1DC; background:#F3F8FC; overflow:hidden;
    box-shadow:0 4px 14px rgba(20,40,64,.08); }
  .node .hd { background:#DCE9F5; padding:11px 16px 10px; border-bottom:1px solid #C0D0E2; }
  .node .hd .t { font-size:22px; font-weight:700; color:#1A4A7A; letter-spacing:.5px; }
  .node .hd .s { font-size:14px; color:#5A7A96; margin-top:2px; }
  .node .bd { padding:10px 16px 8px; }
  .item { display:flex; align-items:center; gap:9px; padding:6.5px 0; }
  .item .b { width:7px; height:7px; border-radius:2px; background:#2D7AB3; flex:none; }
  .item .x { font-size:17px; color:#142840; }
  .item .x code { font-family:'Sarasa Mono SC','Noto Sans SC',monospace; font-size:15px; color:#5A7a96; }
  .n1 { left:0; top:36px; }
  .n2 { left:350px; top:36px; }
  .n3 { left:700px; top:36px; }
  .n2 { border-color:#1A4A7A; }
  .n2 .hd { background:#C6DAEC; }
  .store { position:absolute; left:330px; top:336px; width:340px; height:92px;
    border:1.8px dashed #8FA8C2; border-radius:12px; background:#F7FAFD;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .store .t { font-size:19px; font-weight:700; color:#1A4A7A; }
  .store .p { font-family:'Sarasa Mono SC','Noto Sans SC',monospace; font-size:14.5px; color:#5A7A96; }
  .lbl { position:absolute; font-size:16px; font-weight:600; color:#5A7A96; background:#fff; padding:0 6px; }
  svg.wire { position:absolute; left:0; top:0; }
</style>
</head>
<body>
<div class="canvas">
  <svg class="wire" width="1000" height="486" viewBox="0 0 1000 486" fill="none">
    <defs>
      <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M1 1 L8 4.5 L1 8" stroke="#94A3B8" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </marker>
    </defs>
    <line x1="302" y1="160" x2="346" y2="160" stroke="#94A3B8" stroke-width="2.2" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <line x1="652" y1="160" x2="696" y2="160" stroke="#94A3B8" stroke-width="2.2" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <line x1="500" y1="288" x2="500" y2="332" stroke="#94A3B8" stroke-width="2.2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  </svg>

  <div class="node n1">
    <div class="hd"><div class="t">系统集成层</div><div class="s">Electron 主进程 API</div></div>
    <div class="bd">
      <div class="item"><div class="b"></div><div class="x">全局快捷键 <code>globalShortcut</code></div></div>
      <div class="item"><div class="b"></div><div class="x">开机自启动 <code>setLoginItemSettings</code></div></div>
      <div class="item"><div class="b"></div><div class="x">系统通知 <code>Notification</code></div></div>
      <div class="item"><div class="b"></div><div class="x">托盘与菜单 <code>Tray</code></div></div>
    </div>
  </div>

  <div class="node n2">
    <div class="hd"><div class="t">应用主进程</div><div class="s">Node.js 运行时</div></div>
    <div class="bd">
      <div class="item"><div class="b"></div><div class="x">无边框置顶窗口管理</div></div>
      <div class="item"><div class="b"></div><div class="x">磁吸停靠与滑出动画</div></div>
      <div class="item"><div class="b"></div><div class="x">定时提醒调度</div></div>
      <div class="item"><div class="b"></div><div class="x">任务数据读写</div></div>
    </div>
  </div>

  <div class="node n3">
    <div class="hd"><div class="t">界面渲染进程</div><div class="s">便签 UI</div></div>
    <div class="bd">
      <div class="item"><div class="b"></div><div class="x">任务列表与录入区</div></div>
      <div class="item"><div class="b"></div><div class="x">贴边把手 / Toast 卡片</div></div>
      <div class="item"><div class="b"></div><div class="x">磁吸动效（CSS 过渡）</div></div>
      <div class="item"><div class="b"></div><div class="x">与主进程 IPC 消息</div></div>
    </div>
  </div>

  <div class="lbl" style="left:308px; top:134px;">IPC</div>
  <div class="lbl" style="left:658px; top:134px;">IPC</div>
  <div class="lbl" style="left:512px; top:292px;">同步读写</div>

  <div class="store">
    <div class="t">本地数据文件（明文 JSON）</div>
    <div class="p">%APPDATA%\SnapNote\tasks.json</div>
  </div>
</div>
</body>
</html>
