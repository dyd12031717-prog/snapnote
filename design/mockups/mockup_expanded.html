<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'NSC'; src:url('fonts/NotoSansSC-var.ttf'); font-weight:100 900; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:860px; height:560px; overflow:hidden; }
  body { font-family:'NSC','WenQuanYi Zen Hei',sans-serif; -webkit-font-smoothing:antialiased; }
  .desktop { position:relative; width:860px; height:560px;
    background:
      radial-gradient(700px 460px at 72% 12%, rgba(86,150,214,.42), transparent 62%),
      radial-gradient(560px 420px at 10% 92%, rgba(42,86,158,.5), transparent 66%),
      linear-gradient(118deg, transparent 38%, rgba(255,255,255,.05) 43%, rgba(255,255,255,.05) 46%, transparent 53%),
      linear-gradient(162deg, #10305e 0%, #0b2348 52%, #081a38 100%);
  }
  /* ---------- taskbar ---------- */
  .taskbar { position:absolute; left:0; right:0; bottom:0; height:48px;
    background: rgba(21,28,44,.74); backdrop-filter: blur(16px);
    border-top:1px solid rgba(255,255,255,.07);
    display:flex; align-items:center; justify-content:center; gap:9px; }
  .tbtn { width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.05); }
  .tbtn svg { display:block; }
  /* ---------- desktop icons ---------- */
  .dicon { position:absolute; width:58px; text-align:center; }
  .dicon span { display:block; margin-top:5px; font-size:11.5px; color:rgba(255,255,255,.92); text-shadow:0 1px 3px rgba(0,0,0,.65); }
  /* ---------- note card ---------- */
  .note { position:absolute; right:0; top:62px; width:312px;
    background: linear-gradient(180deg, #FFFEF3 0%, #FFFBEA 55%, #FCF5D8 100%);
    border:1px solid #EFE3B2; border-right:none;
    border-radius:18px 0 0 18px;
    box-shadow: -12px 16px 44px rgba(2,8,20,.5), -1px 0 0 rgba(0,0,0,.06); }
  .tape { position:absolute; top:-10px; left:34px; width:86px; height:21px;
    background: rgba(243,178,58,.78); border-radius:2px; transform:rotate(-3.5deg);
    box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .head { display:flex; align-items:center; justify-content:space-between; padding:17px 13px 11px 19px; }
  .h-date { font-size:17px; font-weight:700; color:#4A3E17; letter-spacing:.5px; }
  .h-badge { display:inline-block; margin-top:6px; font-size:11.5px; font-weight:600; color:#9A6A00;
    background:#FDF1C9; border:1px solid #EDDFA5; border-radius:999px; padding:2.5px 9px; }
  .h-icons { display:flex; gap:7px; }
  .ibtn { width:26px; height:26px; border-radius:8px; background:rgba(255,255,255,.6);
    border:1px solid #EDE1B4; display:flex; align-items:center; justify-content:center; }
  .dash { margin:0 16px; border-top:1.5px dashed #E9DCAC; }
  .row { display:flex; align-items:center; gap:10px; padding:8.5px 16px; }
  .cb { width:19px; height:19px; border-radius:50%; border:2px solid #D6C276; flex:none; background:rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center; }
  .t-title { flex:1; font-size:15px; color:#4A3E17; }
  .pill { font-size:12.5px; font-weight:600; color:#8A6410; background:#FDF3D3; border:1px solid #EDDFA5;
    border-radius:999px; padding:3px 9px; flex:none; }
  .pill-red { color:#B3261E; background:#FDECEC; border-color:#F3C8C8; }
  .done-wrap { background:rgba(236,225,190,.28); border-top:1.5px dashed #E9DCAC; margin-top:3px; }
  .done-label { padding:7px 16px 0; font-size:11.5px; color:#B3A367; letter-spacing:1.5px; }
  .row.done { padding-top:6px; padding-bottom:10px; }
  .t-done { text-decoration:line-through; color:#A89B6B; }
  .pill-gray { color:#8E8663; background:#F4F0DC; border-color:#E2DBB8; }
  .cb-done { background:#C7BB84; border-color:#C7BB84; }
  /* ---------- input area ---------- */
  .inputbox { margin:10px 14px 16px; }
  .input-row { height:40px; border-radius:11px; background:rgba(255,255,255,.82); border:1.5px solid #E7DBA8;
    display:flex; align-items:center; gap:8px; padding:0 12px; font-size:14.5px; color:#B8A76B; }
  .input-row .spacer { flex:1; }
  .chips { display:flex; gap:7px; margin-top:9px; flex-wrap:wrap; }
  .chip { font-size:12.5px; font-weight:600; color:#8A6410; background:#FFF7DF; border:1px solid #EDDFA5;
    border-radius:999px; padding:3.5px 11px; }
  .chip.on { background:#F59E0B; color:#fff; border-color:#F59E0B; }
  .chip.more { background:transparent; border-style:dashed; color:#A5904E; }
</style>
</head>
<body>
<div class="desktop">

  <!-- desktop icons -->
  <div class="dicon" style="left:26px; top:24px;">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="1.6" stroke-linejoin="round">
      <rect x="4" y="6" width="26" height="16.5" rx="2.2"/><path d="M12 29h10M17 22.5V29"/>
    </svg><span>此电脑</span>
  </div>
  <div class="dicon" style="left:26px; top:100px;">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="1.6" stroke-linejoin="round">
      <path d="M8 9h18l-1.4 18.2c-.06.9-.8 1.6-1.7 1.6H11.1c-.9 0-1.64-.7-1.7-1.6L8 9z"/><path d="M6 9h22M13.5 6.5h7" stroke-linecap="round"/>
    </svg><span>回收站</span>
  </div>

  <!-- note card -->
  <div class="note">
    <div class="tape"></div>
    <div class="head">
      <div>
        <div class="h-date">9月4日 · 星期五</div>
        <span class="h-badge">今日 4 项待办</span>
      </div>
      <div class="h-icons">
        <div class="ibtn">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#A08A4A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.2 1.2 12.8 4.8 5 12.6 1.4 12.6 1.4 9z"/>
          </svg>
        </div>
        <div class="ibtn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#A08A4A" stroke-width="1.7" stroke-linecap="round">
            <path d="M2 2l8 8M10 2l-8 8"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="dash"></div>

    <div class="row">
      <div class="cb"></div>
      <div class="t-title">部门周会 · 会议室 A</div>
      <div class="pill">09:30</div>
    </div>
    <div class="row">
      <div class="cb"></div>
      <div class="t-title">给王总回电话</div>
      <div class="pill">14:00</div>
    </div>
    <div class="row">
      <div class="cb"></div>
      <div class="t-title">提交设计稿</div>
      <div class="pill pill-red">已过期 16:00</div>
    </div>
    <div class="row">
      <div class="cb"></div>
      <div class="t-title">健身 · 带毛巾</div>
      <div class="pill">18:30</div>
    </div>

    <div class="done-wrap">
      <div class="done-label">已完成 · 1</div>
      <div class="row done">
        <div class="cb cb-done">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1.5 5.2 4 7.6 8.5 2.4"/>
          </svg>
        </div>
        <div class="t-title t-done">发昨日日报</div>
        <div class="pill pill-gray">08:50</div>
      </div>
    </div>

    <div class="inputbox">
      <div class="input-row">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#C0B076" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.2 1.6 12.4 3.8 4.8 11.4 1.6 12.4 2.6 9.2z"/>
        </svg>
        <span>记点什么… 回车保存</span>
        <span class="spacer"></span>
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="#C0B076" stroke-width="1.5" stroke-linecap="round">
          <rect x="1.5" y="2.5" width="12" height="11" rx="2"/><path d="M1.5 6h12M5 1.5v2.4M10 1.5v2.4"/>
        </svg>
      </div>
      <div class="chips">
        <span class="chip on">+30 分钟</span>
        <span class="chip">今晚 20:00</span>
        <span class="chip">明天 9:00</span>
        <span class="chip more">自定义…</span>
      </div>
    </div>
  </div>

  <!-- taskbar -->
  <div class="taskbar">
    <div class="tbtn">
      <svg width="17" height="17" viewBox="0 0 18 18"><rect x="1" y="1" width="7.2" height="7.2" rx="1" fill="#4FA8E8"/><rect x="9.8" y="1" width="7.2" height="7.2" rx="1" fill="#4FA8E8"/><rect x="1" y="9.8" width="7.2" height="7.2" rx="1" fill="#4FA8E8"/><rect x="9.8" y="9.8" width="7.2" height="7.2" rx="1" fill="#4FA8E8"/></svg>
    </div>
    <div class="tbtn">
      <svg width="16" height="16" viewBox="0 0 17 17" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="5.2"/><line x1="11" y1="11" x2="15.2" y2="15.2"/></svg>
    </div>
    <div class="tbtn">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M2 4.6c0-.6.5-1.1 1.1-1.1h3.1l1.7 1.8h6c.6 0 1.1.5 1.1 1.1v6.7c0 .6-.5 1.1-1.1 1.1H3.1c-.6 0-1.1-.5-1.1-1.1V4.6z" fill="#E4B25C"/></svg>
    </div>
    <div class="tbtn">
      <svg width="16" height="16" viewBox="0 0 17 17" fill="none" stroke="#4FA8E8" stroke-width="1.6"><circle cx="8.5" cy="8.5" r="6.4"/><path d="M2.4 9.4c2-3.4 4.6-5.2 6.1-5.2s4.1 1.8 6.1 5.2" stroke="rgba(255,255,255,.8)" stroke-width="1.3"/></svg>
    </div>
    <div class="tbtn">
      <svg width="17" height="17" viewBox="0 0 18 18"><rect x="2" y="2.5" width="14" height="13" rx="2.4" fill="#F5B93E"/><path d="M2.4 5.4h13.2" stroke="rgba(0,0,0,.14)" stroke-width="1"/><path d="M5.2 8.6h7.6M5.2 11.6h5" stroke="rgba(90,60,10,.55)" stroke-width="1.3" stroke-linecap="round"/></svg>
    </div>
  </div>
</div>
</body>
</html>
