<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'NSC'; src:url('fonts/NotoSansSC-var.ttf'); font-weight:100 900; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:860px; height:560px; overflow:hidden; }
  body { font-family:'NSC','WenQuanYi Zen Hei',sans-serif; -webkit-font-smoothing:antialiased; }
  .desktop { position:relative; width:860px; height:560px;
    background:
      radial-gradient(700px 460px at 72% 12%, rgba(86,150,214,.42), transparent 62%),
      radial-gradient(560px 420px at 10% 92%, rgba(42,86,158,.5), transparent 66%),
      linear-gradient(118deg, transparent 38%, rgba(255,255,255,.05) 43%, rgba(255,255,255,.05) 46%, transparent 53%),
      linear-gradient(162deg, #10305e 0%, #0b2348 52%, #081a38 100%);
  }
  .taskbar { position:absolute; left:0; right:0; bottom:0; height:48px;
    background: rgba(21,28,44,.74); backdrop-filter: blur(16px);
    border-top:1px solid rgba(255,255,255,.07);
    display:flex; align-items:center; justify-content:center; gap:9px; }
  .tbtn { width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.05); }
  .tbtn svg { display:block; }
  .dicon { position:absolute; width:58px; text-align:center; }
  .dicon span { display:block; margin-top:5px; font-size:11.5px; color:rgba(255,255,255,.92); text-shadow:0 1px 3px rgba(0,0,0,.65); }
  /* ---------- boot toast ---------- */
  .toast { position:absolute; top:14px; right:14px; width:338px;
    background: rgba(252,253,255,.98); border-radius:15px;
    box-shadow: 0 14px 40px rgba(2,8,20,.5), 0 0 0 1px rgba(255,255,255,.55);
    padding:15px 13px 15px 20px; overflow:hidden; }
  .accent { position:absolute; left:0; top:0; bottom:0; width:4.5px;
    background: linear-gradient(180deg, #FBBF24 0%, #F59E0B 100%); border-radius:4px; }
  .toast-main { display:flex; align-items:flex-start; gap:12px; }
  .t-icon { width:38px; height:38px; border-radius:10px; background:#FEF3C7; flex:none;
    display:flex; align-items:center; justify-content:center; }
  .t-texts { flex:1; min-width:0; }
  .t-title { font-size:16px; font-weight:700; color:#1F2937; }
  .t-sub { font-size:13px; color:#6B7280; margin-top:4px; }
  .t-link { font-size:13px; font-weight:600; color:#B45309; margin-top:9px; display:inline-block; }
  .t-close { width:26px; height:26px; border-radius:8px; background:rgba(17,24,39,.05); flex:none;
    display:flex; align-items:center; justify-content:center; }
  /* ---------- docked handle (context) ---------- */
  .handle { position:absolute; right:0; top:206px; width:30px; height:152px;
    background: linear-gradient(180deg, #FBC536 0%, #F39C12 100%);
    border-radius: 15px 0 0 15px;
    box-shadow: -8px 6px 22px rgba(243,156,18,.38), inset 0 0 0 1px rgba(255,255,255,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#EF4444; border:2px solid #FFF6DE; }
  .vtext { writing-mode: vertical-rl; font-size:13.5px; font-weight:700; color:#FFF6DE; letter-spacing:4px; }
  .badge { min-width:20px; height:20px; border-radius:10px; background:rgba(122,74,6,.55);
    color:#FFF6DE; font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 4px; }
</style>
</head>
<body>
<div class="desktop">

  <div class="dicon" style="left:26px; top:24px;">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="1.6" stroke-linejoin="round">
      <rect x="4" y="6" width="26" height="16.5" rx="2.2"/><path d="M12 29h10M17 22.5V29"/>
    </svg><span>此电脑</span>
  </div>
  <div class="dicon" style="left:26px; top:100px;">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="1.6" stroke-linejoin="round">
      <path d="M8 9h18l-1.4 18.2c-.06.9-.8 1.6-1.7 1.6H11.1c-.9 0-1.64-.7-1.7-1.6L8 9z"/><path d="M6 9h22M13.5 6.5h7" stroke-linecap="round"/>
    </svg><span>回收站</span>
  </div>

  <!-- boot reminder toast -->
  <div class="toast">
    <div class="accent"></div>
    <div class="toast-main">
      <div class="t-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#B45309" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3.5" width="16" height="14" rx="2.5"/>
          <path d="M2 7.5h16M6.5 2v3M13.5 2v3"/>
          <path d="M7 12.6l2 2 4-4.2" stroke-width="1.9"/>
        </svg>
      </div>
      <div class="t-texts">
        <div class="t-title">早上好，今天有 4 个任务</div>
        <div class="t-sub">最早 09:30 · 部门周会 · 会议室 A</div>
        <span class="t-link">查看今天安排 →</span>
      </div>
      <div class="t-close">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="rgba(31,41,55,.6)" stroke-width="1.8" stroke-linecap="round">
          <path d="M2 2l8 8M10 2l-8 8"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- docked handle below -->
  <div class="handle">
    <div class="dot"></div>
    <div class="vtext">今日</div>
    <div class="badge">4</div>
  </div>

  <!-- taskbar -->
  <div class="taskbar">
    <div class="tbtn">
      <svg width="17" height="17" viewBox="0 0 18 18"><rect x="1" y="1" width="7.2" height="7.2" rx="1" fill="#4FA8E8"/><rect x="9.8" y="1" width="7.2" height="7.2" rx="1" fill="#4FA8E8"/><rect x="1" y="9.8" width="7.2" height="7.2" rx="1" fill="#4FA8E8"/><rect x="9.8" y="9.8" width="7.2" height="7.2" rx="1" fill="#4FA8E8"/></svg>
    </div>
    <div class="tbtn">
      <svg width="16" height="16" viewBox="0 0 17 17" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="5.2"/><line x1="11" y1="11" x2="15.2" y2="15.2"/></svg>
    </div>
    <div class="tbtn">
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M2 4.6c0-.6.5-1.1 1.1-1.1h3.1l1.7 1.8h6c.6 0 1.1.5 1.1 1.1v6.7c0 .6-.5 1.1-1.1 1.1H3.1c-.6 0-1.1-.5-1.1-1.1V4.6z" fill="#E4B25C"/></svg>
    </div>
    <div class="tbtn">
      <svg width="16" height="16" viewBox="0 0 17 17" fill="none" stroke="#4FA8E8" stroke-width="1.6"><circle cx="8.5" cy="8.5" r="6.4"/><path d="M2.4 9.4c2-3.4 4.6-5.2 6.1-5.2s4.1 1.8 6.1 5.2" stroke="rgba(255,255,255,.8)" stroke-width="1.3"/></svg>
    </div>
    <div class="tbtn">
      <svg width="17" height="17" viewBox="0 0 18 18"><rect x="2" y="2.5" width="14" height="13" rx="2.4" fill="#F5B93E"/><path d="M2.4 5.4h13.2" stroke="rgba(0,0,0,.14)" stroke-width="1"/><path d="M5.2 8.6h7.6M5.2 11.6h5" stroke="rgba(90,60,10,.55)" stroke-width="1.3" stroke-linecap="round"/></svg>
    </div>
  </div>
</div>
</body>
</html>
