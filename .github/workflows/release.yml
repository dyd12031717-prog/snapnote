name: release

# 推送 v* 标签时自动构建 Windows 便携包并发布 GitHub Release
# 也可在 Actions 页面手动触发（workflow_dispatch）
# v1.6.0：双目录原子切换布局——zip 根 = { SnapNote.exe(launcher), channels.json, app-<ver>/ }，
# 主程序更名 SnapNoteApp.exe（构建时 executableName），更新链为纯 Node（详见 docs/PRD-dualdir.md）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 注入仓库所有者与版本号（供应用内自动更新定位 Releases API）
        shell: bash
        run: |
          OWNER='${{ github.repository_owner }}'
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ]; then
            npm version "$TAG" --no-git-tag-version --allow-same-version
          fi
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.repository = p.repository || { type: 'github' };
            p.repository.owner = '$OWNER';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: 安装依赖
        run: npm install --no-fund --no-audit

      - name: 单元测试
        run: npm test

      - name: 构建 Windows 便携包（仅目录形态，双目录组装由后续步骤完成）
        run: npx electron-builder --win --dir --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 编译启动器与升级器（Roslyn csc）
        # 启动器：逻辑永不变化（读指针拉起 app-<ver>\SnapNoteApp.exe）
        # 升级器：v1.6.3「关软件-升级-重启」全自动升级包（读位置锚/杀进程/翻指针）
        # 用 VS2022 自带 Roslyn（C#6+：局部函数/异常过滤器）；Framework csc 只到 C#5 编不过
        shell: pwsh
        run: |
          $csc = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\MSBuild\Current\Bin\Roslyn\csc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $csc) { $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" }
          Write-Host "csc = $csc"
          if (-not (Test-Path $csc)) { Write-Error "找不到任何 csc 编译器"; exit 1 }
          $fw = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319"
          $refs = @("/r:System.dll", "/r:System.Core.dll", "/r:System.Windows.Forms.dll", "/r:System.Drawing.dll",
                    "/r:System.IO.Compression.dll", "/r:System.IO.Compression.FileSystem.dll", "/lib:$fw")
          & $csc @refs /nologo /target:winexe /win32icon:assets\icon.ico /out:launcher\SnapNote.exe launcher\SnapNoteLauncher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $size = (Get-Item launcher\SnapNote.exe).Length
          Write-Host "launcher size = $size bytes"
          if ($size -lt 5000 -or $size -gt 200000) { Write-Error "启动器体积异常：$size"; exit 1 }
          & $csc @refs /nologo /target:winexe /out:launcher\SnapNoteUpgrader.exe launcher\SnapNoteUpgrader.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $usize = (Get-Item launcher\SnapNoteUpgrader.exe).Length
          Write-Host "upgrader size = $usize bytes"
          if ($usize -lt 5000 -or $usize -gt 300000) { Write-Error "升级器体积异常：$usize"; exit 1 }

      - name: 组装双目录成品 zip（launcher + channels.json + app-<ver>/）
        shell: bash
        run: bash scripts/package_dualdir.sh

      - name: 组装升级包（SnapNoteUpgrader.exe + data.zip，v1.6.3）
        shell: bash
        run: bash scripts/package_upgrader.sh

      - name: 打包产物真实冒烟（组装布局内主程序自检）
        # v1.4.1 教训沿用：GUI 子系统 exe 在 pwsh 里不等待直接返回，退出码被吞。
        # v1.6.0：跑组装后的 app-<ver>\SnapNoteApp.exe（与用户实际运行的二进制同路径形态）
        shell: pwsh
        run: |
          $app = Get-ChildItem "release\.staging\app-*" -Directory | Select-Object -First 1
          if (-not $app) { Write-Error "staging 下无 app-* 目录"; exit 1 }
          $p = Start-Process -FilePath "$($app.FullName)\SnapNoteApp.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          Write-Host "smoke exit code: $($p.ExitCode)"
          exit $p.ExitCode
        env:
          SNAPNOTE_FAST: '1'
        timeout-minutes: 4

      - name: 生成 sha256 校验文件（v1.5.1：客户端国内镜像加速的前置信任锚）
        shell: pwsh
        run: |
          $zip = Get-ChildItem "release\SnapNote-Portable-*-win-x64.zip" | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -Encoding ascii -NoNewline "release\$($zip.Name).sha256"
          Write-Host "sha256: $hash"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SnapNote-Portable-*-win-x64.zip
            release/SnapNote-Portable-*-win-x64.zip.sha256
            release/SnapNote-Upgrader-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: 上传构建产物（供 e2e job 使用）
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            release/SnapNote-Portable-*-win-x64.zip
            release/SnapNote-Portable-*-win-x64.zip.sha256
            release/SnapNote-Upgrader-*.zip
          retention-days: 3
          if-no-files-found: error

  # 端到端更新自测（v1.6.0 双目录链）：独立 job，失败不阻断 Release 发布
  # （用户能正常拿包），但会在 Actions 页面亮红。真实 Windows 上跑：
  # zip 解压 → installNewVersion 就位翻指针 → 新 exe 冒烟 → launcher 入口链 → 回滚。
  # v1.5.x 时代此 job 观测的是 PS 镜像替换链健康度；现在 PS 链已退役，
  # Node 链全部在单测覆盖，本 job 验证「真实 exe/launcher/文件系统」这一层。
  e2e-update:
    runs-on: windows-latest
    needs: build-windows
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: release

      - name: 端到端更新自测（真实跑一遍双目录更新链）
        run: node scripts/e2e_update.js
        timeout-minutes: 12
