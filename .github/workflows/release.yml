name: release

# 推送 v* 标签时自动构建 Windows 便携包并发布 GitHub Release
# 也可在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 注入仓库所有者与版本号（供应用内自动更新定位 Releases API）
        shell: bash
        run: |
          OWNER='${{ github.repository_owner }}'
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "$TAG" ]; then
            npm version "$TAG" --no-git-tag-version --allow-same-version
          fi
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.repository = p.repository || { type: 'github' };
            p.repository.owner = '$OWNER';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: 安装依赖
        run: npm install --no-fund --no-audit

      - name: 单元测试
        run: npm test

      - name: 构建 Windows 便携包
        run: npx electron-builder --win zip --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 打包产物真实冒烟（运行打包后的 exe 自检）
        # v1.4.1：GUI 子系统 exe 在 pwsh 里不等待直接返回，退出码被吞（历史假绿）。
        # 必须 Start-Process -Wait -PassThru 取真实 ExitCode。
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\release\win-unpacked\SnapNote.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          Write-Host "smoke exit code: $($p.ExitCode)"
          exit $p.ExitCode
        env:
          SNAPNOTE_FAST: '1'
        timeout-minutes: 4

      - name: 生成 sha256 校验文件（v1.5.1：客户端国内镜像加速的前置信任锚）
        shell: pwsh
        run: |
          $zip = Get-ChildItem "release\SnapNote-Portable-*-win-x64.zip" | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -Encoding ascii -NoNewline "release\$($zip.Name).sha256"
          Write-Host "sha256: $hash"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SnapNote-Portable-*-win-x64.zip
            release/SnapNote-Portable-*-win-x64.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: 上传构建产物（供 e2e job 使用）
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            release/win-unpacked/**
            release/SnapNote-Portable-*-win-x64.zip
          retention-days: 3
          if-no-files-found: error

  # 端到端更新自测：独立 job，失败不阻断 Release 发布（用户能正常拿包），
  # 但会在 Actions 页面亮红提醒。Windows runner 服务会话的进程树行为与真实
  # 桌面存在差异（detached PowerShell 更新脚本 + taskkill 时序），此 job
  # 用于持续观测真实替换链健康度，失败时优先看其日志里的 update.log 转储。
  e2e-update:
    runs-on: windows-latest
    needs: build-windows
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: release

      - name: 端到端更新自测（真实跑一遍“重启更新”替换链路）
        # v1.4.1：历史上"重启并更新"因生产装配缺配静默失灵，单测曾全绿。
        # 此步骤在真实 Windows 上执行完整 PowerShell 替换链（旧目录→镜像→换 exe→拉起新进程）。
        run: node scripts/e2e_update.js
        timeout-minutes: 12
