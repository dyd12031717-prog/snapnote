<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>磁吸便签 · 设置</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #F7F4EC;
    font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
    color: #4A3000; overflow: hidden; }
  .wrap { height: 100%; display: flex; flex-direction: column; }
  .head { padding: 14px 18px 10px; background: linear-gradient(180deg, #FBC536, #F5A623);
    display: flex; align-items: center; gap: 10px; }
  .head .logo { width: 26px; height: 26px; border-radius: 8px;
    background: rgba(122,74,6,.25); position: relative; }
  .head .logo:before, .head .logo:after { content: ''; position: absolute; left: 6px;
    height: 2px; background: #5A3A00; border-radius: 2px; }
  .head .logo:before { top: 9px; width: 14px; } .head .logo:after { top: 15px; width: 9px; }
  .head .t { font-size: 14.5px; font-weight: 800; }
  .body { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .row { display: flex; align-items: center; justify-content: space-between;
    padding: 11px 12px; margin-bottom: 9px; background: #FFFDF4;
    border: 1px solid rgba(240,198,79,.7); border-radius: 11px; }
  .row .label { font-size: 13px; font-weight: 700; }
  .row .hint { font-size: 10.5px; color: #B9985E; margin-top: 3px; }
  .row .col { max-width: 60%; text-align: left; }
  .ctrl { text-align: right; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: #F39C12; cursor: pointer; }
  #hotkeyInput {
    width: 150px; height: 30px; text-align: center;
    border: 1.5px solid #F0C64F; border-radius: 8px; outline: none;
    background: #FFF9E8; font-size: 13px; font-weight: 700; cursor: pointer; }
  #hotkeyInput.rec { border-color: #F39C12; background: #FFEFD2; }
  #delayInput { width: 80px; height: 30px; text-align: center;
    border: 1.5px solid #F0C64F; border-radius: 8px; outline: none;
    background: #FFF9E8; font-size: 13px; }
  .foot { padding: 12px 18px; border-top: 1px dashed rgba(224,169,60,.5);
    display: flex; gap: 10px; align-items: center; }
  .btn { border: none; border-radius: 9px; padding: 9px 22px;
    font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: #F39C12; color: #FFF; }
  .btn-primary:hover { background: #E08E08; }
  .btn-plain { background: #FFF3D6; color: #9A6A10; border: 1px solid rgba(243,156,18,.5); }
  .status { flex: 1; font-size: 11px; color: #8FA35C; text-align: right; }
  .status.err { color: #C0392B; }
  .ver { padding: 0 18px 10px; font-size: 10.5px; color: #B9985E; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo"></div><div class="t">磁吸便签 · 设置</div></div>
  <div class="body">
    <div class="row">
      <div class="col"><div class="label">全局快捷键</div>
        <div class="hint">唤起 / 收起便签。点击右侧后按下新组合键</div></div>
      <div class="ctrl"><input id="hotkeyInput" readonly value="Ctrl+Alt+N"></div>
    </div>
    <div class="row">
      <div class="col"><div class="label">开机自启动</div>
        <div class="hint">随 Windows 登录自动启动并静默贴边</div></div>
      <div class="ctrl"><input type="checkbox" id="autostart" checked></div>
    </div>
    <div class="row">
      <div class="col"><div class="label">开机今日提醒</div>
        <div class="hint">登录后在屏幕右上角显示今日任务摘要</div></div>
      <div class="ctrl"><input type="checkbox" id="startupToast" checked></div>
    </div>
    <div class="row">
      <div class="col"><div class="label">到点提醒音</div>
        <div class="hint">任务到点时播放两声短提示音</div></div>
      <div class="ctrl"><input type="checkbox" id="sound" checked></div>
    </div>
    <div class="row">
      <div class="col"><div class="label">自动收起延时</div>
        <div class="hint">便签失焦后多少秒磁回屏幕边缘（5–600）</div></div>
      <div class="ctrl"><input id="delayInput" type="number" min="5" max="600" value="30"></div>
    </div>
  </div>
  <div class="foot">
    <button class="btn btn-primary" id="save">保存</button>
    <button class="btn btn-plain" id="reset">恢复默认</button>
    <div class="status" id="status"></div>
  </div>
  <div class="ver">数据保存在本机：%APPDATA%\SnapNote\tasks.json · 完全离线</div>
</div>
<script>
  (function () {
    const api = window.snapnote || window.__SNAPNOTE_MOCK__;
    const $ = (id) => document.getElementById(id);
    const hotkeyInput = $('hotkeyInput');
    let settings = { hotkey: 'Ctrl+Alt+N', autostart: true, startupToast: true, sound: true, collapseDelay: 30 };
    let recording = false;

    function fill(s) { settings = Object.assign(settings, s || {});
      hotkeyInput.value = settings.hotkey;
      $('autostart').checked = !!settings.autostart;
      $('startupToast').checked = !!settings.startupToast;
      $('sound').checked = !!settings.sound;
      $('delayInput').value = settings.collapseDelay; }
    function say(msg, err) { const st = $('status');
      st.textContent = msg; st.classList.toggle('err', !!err); }

    // 快捷键录制
    hotkeyInput.addEventListener('click', () => {
      recording = true; hotkeyInput.classList.add('rec'); hotkeyInput.value = '请按下组合键…';
    });
    document.addEventListener('keydown', (e) => {
      if (!recording) return;
      e.preventDefault(); e.stopPropagation();
      const key = e.key;
      if (['Control', 'Alt', 'Shift', 'Meta'].includes(key)) return; // 等待主键
      if (key === 'Escape') { recording = false; hotkeyInput.classList.remove('rec');
        hotkeyInput.value = settings.hotkey; return; }
      const mods = [];
      if (e.ctrlKey) mods.push('Ctrl');
      if (e.altKey) mods.push('Alt');
      if (e.shiftKey) mods.push('Shift');
      if (mods.length === 0 && key.length > 1) { say('请加上 Ctrl / Alt / Shift 修饰键', true); return; }
      const k = key.length === 1 ? key.toUpperCase() : key;
      settings.hotkey = mods.concat(k).join('+');
      hotkeyInput.value = settings.hotkey;
      recording = false; hotkeyInput.classList.remove('rec');
      say('记得点“保存”生效');
    });

    $('save').addEventListener('click', async () => {
      settings.autostart = $('autostart').checked;
      settings.startupToast = $('startupToast').checked;
      settings.sound = $('sound').checked;
      settings.collapseDelay = Number($('delayInput').value) || 30;
      if (api && api.setSettings) {
        const s = await api.setSettings({
          hotkey: settings.hotkey, autostart: settings.autostart,
          startupToast: settings.startupToast, sound: settings.sound,
          collapseDelay: settings.collapseDelay,
        });
        fill(s);
        say(s.hotkeyActive === false ? '快捷键可能被占用，请换一组' : '已保存并生效');
      } else say('已保存（本地）');
    });
    $('reset').addEventListener('click', () => {
      fill({ hotkey: 'Ctrl+Alt+N', autostart: true, startupToast: true, sound: true, collapseDelay: 30 });
      say('已恢复默认值，点“保存”生效');
    });

    if (api && api.getSettings) api.getSettings().then(fill).catch(() => {});
  })();
</script>
</body>
</html>
